version: 1

scope:
  include:
    - apps/client/src/**
    - apps/studio/src/**
    - apps/extension/src/**
    - packages/core/src/**
    - packages/composables/src/**
    - packages/hooks/src/**
    - packages/construct/src/**
    - packages/directives/src/**
    - packages/shared/src/**
    - packages/design/src/**
    - packages/utils/src/**
    - packages/wasm/src/**
  exclude:
    - '**/__tests__/**'
    - '**/__test__/**'
    - '**/*.test.*'
    - '**/*.spec.*'
    - '**/*.d.ts'
    - '**/dist/**'
    - '**/node_modules/**'

repowiki:
  template: architecture
  notes:
    - text: 项目采用 pnpm Workspaces + Turbo 的 Monorepo 架构，apps 层 4 个核心应用相互独立，packages 层提供跨应用共享能力。
    - text: client 是基于 React 19 + Ant Design 6 + Tauri 2 的桌面客户端应用，入口为 App.tsx/main.tsx，使用 Zustand 管理状态。
    - text: studio 是基于 Electron Forge + React 19 + Ant Design 6 的桌面编辑器应用，采用 main/preload/renderer 三进程架构，使用 Prisma + better-sqlite3 做本地数据持久化。
    - text: extension 是基于 Vue 3 + vue-router + vue-i18n 的浏览器扩展应用，采用 Composition API 风格，使用 Dexie (IndexedDB) 做本地存储。
    - text: 前端双框架共存：client 和 studio 使用 React，extension 使用 Vue 3；packages 中 hooks 服务 React，composables/directives 服务 Vue，core/utils/shared 跨框架复用。
    - text: 富文本协作是核心能力，基于 TipTap 3 + Yjs + Hocuspocus 实现多人实时协同编辑，extension 中大量使用此能力。
    - text: 构建工具统一使用 Vite 8，所有包通过 Turbo 管道编排构建任务。

knowledgecard:
  notes:
    - text: 每个知识卡应明确标注模块所属应用/包、入口文件路径、核心目录职责划分，以及该模块对外暴露的主要 API 或组件。
    - text: client 的 src 目录按功能域组织：apis（HTTP 请求层）、components（UI 组件）、features（业务特性模块）、stores（Zustand 状态管理）、views（页面路由组件）。
    - text: studio 采用 Electron 三进程架构：main（主进程，含 Prisma ORM）、preload（预加载桥接）、renderer（渲染进程 React UI），shared 目录存放跨进程共享类型和工具。
    - text: extension 的 src 目录遵循 Vue 3 标准分层：composables（组合式函数）、components（组件）、views（页面）、stores（Pinia 状态管理）、database（Dexie IndexedDB 层）。
    - text: 编码规范要点：项目使用 ESLint + Prettier 统一代码风格；TypeScript 严格模式；React 组件使用函数式 + Hooks；Vue 组件使用 <script setup> 语法。
    - text: 模块间依赖通过 workspace:* 协议引用，packages 层不允许反向依赖 apps 层；@cogito/shared 作为开发依赖提供构建期工具。
