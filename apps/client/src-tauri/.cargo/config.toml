[build]
target-dir    = "target"  # 构建输出目录
# sccache 在 Windows 上走 TCP；端口勿落在动态区(≥49152)，否则易被 Hyper-V/WSL 排除(os error 10013)。
rustc-wrapper = "sccache"

# 强制压住 Cursor/旧终端里继承的坏端口（如 50100 落在排除区）。
[env]
SCCACHE_SERVER_PORT = { value = "42222", force = true }

# Windows (MSVC)
# [target.x86_64-pc-windows-msvc]
# linker = "lld-link"

# # macOS
# [target.x86_64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=/usr/local/bin/zld"] # 或使用默认的 ld64

# # Linux
# [target.x86_64-unknown-linux-gnu]
# rustflags = ["-C", "linker=clang", "-C", "link-arg=-fuse-ld=mold"]

# Windows MSVC 目标栈大小配置（8MB）
# [target.x86_64-pc-windows-msvc]
# rustflags = ["-C", "link-arg=/STACK:8000000"]

# Windows MSVC 目标栈大小配置（16MB）
# [target.x86_64-pc-windows-msvc]
# rustflags = ["-C", "link-arg=/STACK:16777216"]

# Windows MSVC 目标栈大小配置（32MB）
# [target.x86_64-pc-windows-msvc]
# rustflags = ["-C", "link-arg=/STACK:33554432"]   # 32MB

# Windows MSVC 目标栈大小配置（64MB）
# [target.x86_64-pc-windows-msvc]
# rustflags = ["-C", "link-arg=/STACK:67108864"]

# Windows MSVC 目标栈大小配置（256MB）
# [target.x86_64-pc-windows-msvc]
# rustflags = ["-C", "link-arg=/STACK:268435456"]

# Windows MSVC 目标栈大小配置（512MB）
# [target.x86_64-pc-windows-msvc]
# rustflags = ["-C", "link-arg=/STACK:536870912"]
