[package]
name    = "cogito-core"
version = "0.1.0"
edition = "2024"

[dependencies]
cogito-database = { workspace = true }
# 代码索引（S12）：符号 / 边只读派生数据
cogito-codeindex = { workspace = true }
sea-orm           = { workspace = true }
chrono            = { workspace = true }
chrono-tz         = { workspace = true }
cron              = { workspace = true }
zip               = { workspace = true }
uuid              = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
anyhow            = { workspace = true }
thiserror         = { workspace = true }
# 审计写入失败只记日志、不影响工具调用（S6：审计是旁路不是闸门）
tracing           = { workspace = true }
# 运行时代码用 `tokio::sync::Mutex` 串行化「读最大值 → 插入」的 index 分配
# （磁贴服务；`std::sync::Mutex` 的 guard 不是 Send，跨 await 就编译不过）
tokio             = { workspace = true }

[dev-dependencies]
# 单测跑 async runtime（用的就是上面的 tokio）
tokio = { workspace = true }
