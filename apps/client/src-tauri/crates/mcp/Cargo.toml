[package]
name    = "cogito-mcp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cogito-mcp"
path = "src/main.rs"

[dependencies]
rmcp       = { version = "3.4.0", default-features = false, features = ["server", "transport-io"] }
serde_json = { workspace = true }
tokio      = { workspace = true }
# 只访问 127.0.0.1 的桥：不需要 TLS 后端
reqwest    = { version = "0.12", default-features = false, features = ["json"] }
