[workspace]
members = [".", "crates/database", "crates/core", "crates/command", "crates/mcp"]
resolver = "2"

[workspace.dependencies]
sea-orm = { version = "1.1.19", features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-uuid",
] }
sea-query = "1.0.0"
sea-orm-migration = "1.1.19"
axum = "0.8"
tokio = { version = "1.52.3", features = ["full"] }
async-trait = "0.1"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.22.0", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.102"
thiserror = "2.0.18"
tracing = "0.1.44"
tauri = { version = "2.12.4", features = [
  "protocol-asset",
  "macos-private-api",
  "devtools",
  "tray-icon",
  "image-png",
  "unstable",
] }
cogito-database = { path = "crates/database" }
cogito-core = { path = "crates/core" }
cogito-command = { path = "crates/command" }

[package]
name = "cogito"
version = "1.5.0"
description = "cogito is a privacy-first extension that enhances your browsing experience with intelligent features while prioritizing your data security."
authors = ["layen"]
edition = "2024"

[[bin]]
name = "cogito"
path = "src/main.rs"

[lib]
name = "cogito"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
# 开发环境：关闭增量编译（有时增量编译反而会导致 target 膨胀和链接变慢）
# 降低 debug 信息级别，极大减少 target 体积和链接时间
debug = 0
split-debuginfo = "unpacked"

[profile.dev.package."*"]
# 将所有第三方依赖的优化级别设为 1，加快运行速度，且只编译一次
opt-level = 1

[profile.release]
# 生产环境：极限压缩体积（参考知识库中的 Tauri 优化方案）
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
# 构建：tauri 代码生成 / 资源打包
tauri-build = { version = "2.7.3", features = [
  "config-json5",
  "tauri-codegen",
  "codegen",
] }

[dependencies]
cogito-database = { workspace = true }
cogito-core = { workspace = true }
cogito-command = { workspace = true }

# --- Tauri 核心 ---
tauri = { workspace = true } # 应用壳、窗口、tray、IPC

# --- 本地工具桥（`cogito-mcp` 経 loopback 调用）---
axum = { workspace = true }

# --- Tauri 插件（已在 bootstrap 注册）---
tauri-plugin-opener = "2.7.2" # 用系统默认应用打开 URL/路径
tauri-plugin-fs = "2.7.1" # 文件系统读写
tauri-plugin-websocket = "2.5.0" # WebSocket（前端能力预留）
tauri-plugin-dialog = "2.8.3" # 原生对话框
tauri-plugin-shell = "2.5.0" # sidecar / 外部命令（corex-daemon）
tauri-plugin-store = "2.5.0" # 持久化 KV
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] } # OS 密钥环
tauri-plugin-process = "2.4.0" # 退出 / 重启
tauri-plugin-notification = "2.7.0" # 系统通知
tauri-plugin-clipboard-manager = "2.5.0" # 剪贴板
tauri-plugin-http = { version = "2.8.3", features = [
  "charset",
  "cookies",
  "gzip",
  "http2",
  "json",
  "multipart",
  "rustls-tls",
  "stream",
  "unsafe-headers",
] } # 前端 fetch
tauri-plugin-os = "2.4.0" # OS 信息（前端能力预留）

# --- Tauri 插件（日志）---
tauri-plugin-log = "2.10.1" # 日志桥（Stdout + LogDir，各一份）

# --- PTY（嵌入式交互终端；wezterm 维护，Windows=ConPTY）---
portable-pty = "0.9"

# --- 异步 / 时间 / 序列化 / 错误 / 日志 ---
tokio = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
log = "0.4"
uuid = { workspace = true }
# --- 媒体 / 编解码 ---
image = "0.25.10" # 截图解码、托盘徽章

# --- Goose ACP serve / pinned WSS ---
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
url = "2"
dirs = "6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# --- 桌面专用插件 ---
tauri-plugin-autostart = "2.7.0" # 开机自启（含 --minimized）
tauri-plugin-cli = "2.5.0" # CLI（--minimized / --verbose）
tauri-plugin-global-shortcut = "2.4.1" # 全局快捷键
tauri-plugin-positioner = { version = "2.4.0", features = [
  "tray-icon",
] } # 窗口/托盘定位
tauri-plugin-single-instance = "2.5.4" # 单实例
tauri-plugin-updater = "2.14.0" # 检查更新

[target.'cfg(target_os = "windows")'.dependencies]
# --- Windows FFI ---
windows = { version = "0.62", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
] } # 与 tauri 2.12 的 windows 0.62 对齐，避免 HWND 跨 crate 分裂

[target.'cfg(target_os = "macos")'.dependencies]
# --- macOS FFI ---
core-graphics = "0.25" # 光标坐标

[dev-dependencies]
# 桥的单测直接 drive axum Router（`ServiceExt::oneshot`），无需真起 TCP。
tower = { version = "0.5", features = ["util"] }
