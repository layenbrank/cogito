[workspace]
resolver = "3"
# 能力 crate（业务内核，与 HTTP 框架解耦）见 crates/；边界与数据所有权由 scripts/arch.ts 强制
members = [
  ".",
  "entity",
  "migration",
  "configures",
  "crates/identity",
  "crates/authz",
  "crates/billing",
  "crates/gateway",
  "crates/document",
  "crates/audit",
  "crates/notify",
  "crates/durable",
  "crates/aliyun",
  "crates/agent",
  "crates/rag",
  "crates/chat",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 闭源产品，不发布到任何 registry；也让 cargo-deny 按私有 crate 处理许可证
publish = false

[workspace.dependencies]
sea-orm = { version = "2.0.2", features = [
  "sqlx-postgres",
  "runtime-tokio-native-tls",
  "macros",
  "with-uuid",
  "with-chrono",
  "postgres-array",
] }
sea-orm-migration = { version = "2.0.2", features = [
  "runtime-tokio-native-tls",
  "sqlx-postgres",
  "cli",
] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.24.1", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
entity = { version = "0.1.0", path = "entity" }

# 出站 HTTP 与其签名原语（service 与能力 crate 共用同一份 feature 集合）
reqwest = { version = "0.13.4", features = [
  "json",
  "query",
  "rustls",
  "stream",
  "form",
] }
sha2 = "0.11.0"
sha1 = "0.11.0"
hmac = "0.13.0"
base64 = "0.23.1"
opendal = { version = "0.59.3", features = ["services-oss"] }
migration = { version = "0.1.0", path = "migration" }

# 可靠执行（duroxide 是被包在 crates/durable 里的实现细节，见 crates/durable/README.md）
duroxide = "0.1.30"
duroxide-pg = "0.1.35"

# 能力 crate（业务内核）
identity = { version = "0.1.0", path = "crates/identity" }
authz = { version = "0.1.0", path = "crates/authz" }
billing = { version = "0.1.0", path = "crates/billing" }
gateway = { version = "0.1.0", path = "crates/gateway" }
document = { version = "0.1.0", path = "crates/document" }
audit = { version = "0.1.0", path = "crates/audit" }
notify = { version = "0.1.0", path = "crates/notify" }
durable  = { version = "0.1.0", path = "crates/durable" }
aliyun   = { version = "0.1.0", path = "crates/aliyun" }
agent    = { version = "0.1.0", path = "crates/agent" }
rag      = { version = "0.1.0", path = "crates/rag" }
chat     = { version = "0.1.0", path = "crates/chat" }

[package]
name              = "cogito"
version.workspace = true
edition.workspace = true
publish.workspace = true

# [profile.release]
# opt-level = 2       # 降低优化级别 (从 3 改为 2)
# lto = true          # 链接时优化（平衡大小与速度）
# codegen-units = 1   # 单线程代码生成（提升优化）
# incremental = false # 禁用增量编译（避免优化冲突）
# panic = "abort"     # 替换展开为直接终止（减小体积）
# strip = "symbols"   # 移除调试符号（Rust 1.59+）

[profile.dev]
incremental = true

[lib]
path       = "src/lib.rs"
crate-type = ["rlib"]
doctest    = false

[[bin]]
name = "cogito"
path = "src/bin/cogito.rs"

[[bin]]
name = "generate"
path = "src/bin/generate.rs"

[[bin]]
name = "docs"
path = "src/bin/docs.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[[bin]]
name = "orchestrator"
path = "src/bin/orchestrator.rs"

[features]
default = []
openapi = ["dep:utoipa-swagger-ui"]

[dependencies]
# Web 框架
actix-web = "4.14.1" # HTTP 服务（TLS 由上游网关终止；进程内不启用 rustls，见 deny.toml 注释）
actix-cors = "0.7.1" # CORS 跨域
actix-files = "0.7.0" # 静态文件 / 下载
actix-multipart = "0.8.0" # multipart 文件上传
governor = "0.10.4" # auth 路由 IP 限流算法（MIT；替代 GPL 的 actix-governor）

# 异步运行时
tokio   = { workspace = true } # 异步运行时（文件 I/O 等）
futures = "0.3.34"             # Stream / Future 组合子

# 序列化
serde      = { workspace = true } # 结构体序列化派生
serde_json = { workspace = true } # JSON 编解码

# 数据库
sea-orm   = { workspace = true }   # SeaORM 2 Entity API
entity    = { workspace = true }
migration = { workspace = true }
log       = "0.4.33"

# HTTP 客户端
reqwest = { workspace = true } # 出站 HTTP 请求（stream：模型网关 SSE 直传）

# Redis
fred = { version = "10", features = ["enable-rustls", "partial-tracing"] }
url = "2"

# 安全 / 加密
argon2       = "0.5.3"                                            # 密码哈希
aes-gcm      = "0.11.0"                                           # AES-256-GCM 加解密
rsa = { version = "0.9.9", features = ["sha2"] }                  # 微信/支付宝 RSA-SHA256 签名验签
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] } # JWT 签发与校验
sha2         = { workspace = true }                              # SHA-256（文件摘要等）
base64       = { workspace = true }                              # Base64 编解码
rand         = "0.10.2"                                           # 随机数（密钥生成）
uuid         = { workspace = true }          # UUID v4（请求 ID 等）

# 错误处理
anyhow    = "1.0.104" # 应用层错误传播
thiserror = { workspace = true } # 类型化错误定义

# 时间
chrono = { workspace = true } # 时间戳 / JWT 过期

# 能力 crate（业务内核，逐块迁入；见 crates/*/README.md）
identity = { workspace = true }
authz    = { workspace = true }
billing  = { workspace = true }
gateway  = { workspace = true }
document = { workspace = true }
audit    = { workspace = true }
notify   = { workspace = true }
durable  = { workspace = true }
aliyun   = { workspace = true }
agent    = { workspace = true }
rag      = { workspace = true }
chat     = { workspace = true }

# 配置
config    = "0.15.19"
configures = { version = "0.1.0", path = "configures" }
tracing = "0.1.44" # 结构化日志 / 追踪
tracing-subscriber = { version = "0.3.22", features = [
  "env-filter",
  "json",
  "chrono",
] } # EnvFilter、fmt、JSON、毫秒时间
tracing-appender = "0.2.4" # 按日轮转 + 非阻塞写入
tracing-log = "0.2.0" # 将 log crate 接到 tracing

# 可观测性（链路 → OTLP/HTTP）
opentelemetry = "0.33.0" # Trace API 与 W3C TraceContext 传播器
opentelemetry_sdk = { version = "0.33.0", features = ["rt-tokio"] } # 资源、采样与批量导出
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = [
  "trace",
  "http-proto",
  "reqwest-rustls",
  # 阻塞式 reqwest 客户端：`with_batch_exporter` 的导出跑在**独立线程**上，那里没有 Tokio
  # reactor，异步客户端一 poll 就 panic（把批处理器线程带走）。见 src/utils/telemetry.rs。
  "reqwest-blocking-client",
] } # 只导 trace，用阻塞 reqwest 客户端（默认含 logs/metrics）
tracing-opentelemetry = "0.34.0" # tracing span → OTel span

# CLI / 终端输出
dialoguer = "0.12.0" # generate 交互式菜单

# OpenAPI 文档
utoipa = { version = "5.5.0", features = ["chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = [
  "actix-web",
], optional = true }

[dev-dependencies]
actix-web = { version = "4.14.1" }
aliyun = { workspace = true }
# 链路测试用内存导出器（只在测试构建里启用 testing 特性）
opentelemetry_sdk = { version = "0.33.0", features = ["rt-tokio", "testing"] }
