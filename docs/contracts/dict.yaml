# 产品状态字典单源契约（全局池 + type 认领）
# value 只增不改号；业务稳定标识是 key。

revision: 2

types:
  - code: knowledge_doc_status
    name: 文档状态
    description: 知识库文档发布状态
  - code: knowledge_doc_source
    name: 文档来源
    description: 知识库文档写入来源
  - code: knowledge_cloud_status
    name: 云端索引状态
    description: 本地云端索引同步状态
  - code: knowledge_base_scope
    name: 知识库范围
    description: 个人或租户共享
  - code: automation_run_status
    name: 自动化运行状态
    description: 定时任务单次运行状态
  - code: automation_trigger_kind
    name: 自动化触发方式
    description: 准点 / 手动 / 补跑
  - code: automation_owner
    name: 自动化执行方
    description: 本机 / goose / 云端
  - code: automation_run_as
    name: 自动化运行身份
    description: 用户或租户身份
  - code: directive_draft_status
    name: 指令草稿状态
    description: 待确认 / 已保存 / 已丢弃
  - code: asset_status
    name: 资源状态
    description: 本地资源状态
  - code: album_status
    name: 相簿状态
    description: 捕获库相簿状态

# 全局池：value 平台唯一
pool:
  - { value: "001", key: DRAFT, label: 草稿, sort: 10, meta: null }
  - { value: "002", key: PUBLISHED, label: 已发布, sort: 20, meta: null }
  - { value: "003", key: MANUAL, label: 手动, sort: 10, meta: null }
  - { value: "004", key: AGENT, label: 智能体, sort: 20, meta: null }
  - { value: "005", key: IMPORT, label: 导入, sort: 30, meta: null }
  - { value: "006", key: AUTHORED, label: 编辑撰写, sort: 40, meta: null }
  - { value: "007", key: CLOUD_IDLE, label: 空闲, sort: 10, meta: null }
  - { value: "008", key: CLOUD_PENDING, label: 待同步, sort: 20, meta: null }
  - { value: "009", key: CLOUD_RUNNING, label: 索引中, sort: 30, meta: '{"tone":"amber"}' }
  - { value: "010", key: CLOUD_SUCCEEDED, label: 已上云, sort: 40, meta: '{"tone":"emerald"}' }
  - { value: "011", key: CLOUD_FAILED, label: 同步失败, sort: 50, meta: '{"tone":"destructive"}' }
  - { value: "012", key: SCOPE_USER, label: 个人, sort: 10, meta: null }
  - { value: "013", key: SCOPE_TENANT, label: 租户, sort: 20, meta: null }
  - { value: "014", key: RUN_PENDING, label: 等待, sort: 10, meta: null }
  - { value: "015", key: RUN_RUNNING, label: 执行中, sort: 20, meta: null }
  - { value: "016", key: RUN_SUCCEEDED, label: 成功, sort: 30, meta: null }
  - { value: "017", key: RUN_FAILED, label: 失败, sort: 40, meta: null }
  - { value: "018", key: TRIGGER_SCHEDULE, label: 按时, sort: 10, meta: null }
  - { value: "019", key: TRIGGER_MANUAL, label: 手动, sort: 20, meta: null }
  - { value: "020", key: TRIGGER_CATCHUP, label: 补跑, sort: 30, meta: null }
  - { value: "021", key: OWNER_CLIENT, label: 本机, sort: 10, meta: null }
  - { value: "022", key: OWNER_GOOSE, label: Goose, sort: 20, meta: null }
  - { value: "023", key: OWNER_CLOUD, label: 云端, sort: 30, meta: null }
  - { value: "024", key: RUN_AS_USER, label: 用户, sort: 10, meta: null }
  - { value: "025", key: RUN_AS_TENANT, label: 租户, sort: 20, meta: null }
  - { value: "026", key: DRAFT_PENDING, label: 待确认, sort: 10, meta: null }
  - { value: "027", key: DRAFT_SAVED, label: 已保存, sort: 20, meta: null }
  - { value: "028", key: DRAFT_DISCARDED, label: 已丢弃, sort: 30, meta: null }
  - { value: "029", key: ACTIVE, label: 正常, sort: 10, meta: null }
  - { value: "030", key: ARCHIVED, label: 已归档, sort: 90, meta: null }

# type → value 认领（同一 value 可被多个 type 认领）；isDefault 标默认项；label 省略则用池默认
