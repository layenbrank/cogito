name: Continuous Integration

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: |
          pnpm turbo run type-check --continue --filter=@i-thinking/extension || true
          pnpm turbo run type-check --continue --filter=@i-thinking/client || true
          pnpm check:scripts
          pnpm command distribution check

      - name: Unit tests
        run: |
          pnpm turbo run unit --continue || true

      - name: Build (exclude Tauri desktop)
        env:
          NODE_ENV: production
        run: pnpm turbo run build --filter=!@i-thinking/client

      - name: Build client web (Vite)
        env:
          NODE_ENV: production
        run: pnpm --filter @i-thinking/client run build:core

      - name: Archive build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          retention-days: 7
          path: |
            apps/**/dist/**
            apps/**/dist-electron/**
            apps/**/.vite/**
            apps/**/out/**
            packages/**/dist/**
            !**/node_modules/**
