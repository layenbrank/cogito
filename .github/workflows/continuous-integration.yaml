name: Continuous Integration

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: |
          pnpm turbo run type-check --continue --filter=@i-thinking/extension || true
          pnpm turbo run type-check --continue --filter=@i-thinking/client
          pnpm check:scripts
          pnpm command distribution check

      - name: Unit tests
        run: |
          pnpm --filter @i-thinking/client run unit
          pnpm turbo run unit --continue --filter=!@i-thinking/client || true

      - name: Build (exclude Tauri desktop)
        env:
          NODE_ENV: production
        run: pnpm turbo run build --filter=!@i-thinking/client

      - name: Build client web (Vite)
        env:
          NODE_ENV: production
        run: pnpm --filter @i-thinking/client run build:core

      - name: Archive build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          retention-days: 7
          path: |
            apps/**/dist/**
            apps/**/dist-electron/**
            apps/**/.vite/**
            apps/**/out/**
            packages/**/dist/**
            !**/node_modules/**

  client-rust-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # build.rs 只校验 binaries/ 下产物存在且非空；真实产物要跑
      # `pnpm command sidecar bootstrap client`（联网拉几百 MB），而 cargo check 不产出安装包，
      # 故用同名占位文件满足校验即可。
      - name: Stub sidecar artifacts for build.rs
        working-directory: apps/client/src-tauri
        run: |
          mkdir -p binaries
          host=$(rustc --print host-tuple)
          for stem in corex-daemon corex-mcp goose; do
            printf 'ci-placeholder\n' > "binaries/${stem}-${host}"
          done
          printf 'ci-placeholder\n' > binaries/pdfium.dll

      - name: Cargo check
        working-directory: apps/client/src-tauri
        run: cargo check --locked
