name: Studio Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'studio-v*'
    branches: [master, develop]
    paths:
      - 'apps/studio/**'
      - 'scripts/commands/features/sidecar/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/studio-desktop.yaml'

concurrency:
  group: studio-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sidecar:
    name: sidecar (${{ matrix.platform_key }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_key: win32-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap sidecars (corex release + pandoc)
        run: pnpm command sidecar bootstrap studio

      - name: Pack staging archive
        shell: bash
        run: |
          KEY="${{ matrix.platform_key }}"
          SHA="$(git rev-parse --short=12 HEAD)"
          STAGING="apps/studio/sidecar/staging/${KEY}"
          OUT="studio-sidecar-${SHA}-${KEY}.tar.gz"
          tar -czf "${OUT}" -C "${STAGING}" .
          if command -v sha256sum >/dev/null; then
            sha256sum "${OUT}" > "${OUT}.sha256"
          else
            shasum -a 256 "${OUT}" > "${OUT}.sha256"
          fi

      - name: Upload sidecar artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sidecar-${{ matrix.platform_key }}
          retention-days: 30
          path: |
            studio-sidecar-*.tar.gz
            studio-sidecar-*.sha256

  make:
    name: make (${{ matrix.os }})
    needs: sidecar
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_key: win32-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        # make 的 vite 构建要解析 @cogito/hooks / utils 这类 exports 指向 dist 的包，
        # 全新检出必须先构建它们。用 `studio...` 再显式排除 studio：`studio^...` 里的 `^`
        # 在 cmd 下是转义符，CI 里会被吃掉，于是把 studio 自己（build = type-check + forge
        # package，需要 sidecar staging）也拉进来，而 staging 那时还没 restore。
        env:
          NODE_ENV: production
        run: pnpm turbo run build --filter=@cogito/studio... --filter=!@cogito/studio

      - name: Rebuild natives
        # 必须是 `run rebuild`：裸 `pnpm rebuild` 是 pnpm 内置命令，不会执行 studio 的
        # electron-rebuild 脚本（会对全仓包重跑 install 脚本，把 Electron ABI 的 better-sqlite3 换成宿主 ABI）
        run: pnpm --filter @cogito/studio run rebuild

      - name: Download sidecar artifact
        uses: actions/download-artifact@v6
        with:
          name: sidecar-${{ matrix.platform_key }}
          path: .sidecar-ci

      - name: Restore staging
        shell: bash
        run: |
          KEY="${{ matrix.platform_key }}"
          DEST="apps/studio/sidecar/staging/${KEY}"
          mkdir -p "${DEST}"
          ARCHIVE="$(ls .sidecar-ci/studio-sidecar-*-${KEY}.tar.gz | head -n1)"
          tar -xzf "${ARCHIVE}" -C "${DEST}"
          pnpm command sidecar verify studio

      - name: Make installers
        env:
          NODE_ENV: production
        run: pnpm --filter @cogito/studio make

      - name: Smoke packaged exe
        run: pnpm --filter @cogito/studio test:pack

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: studio-${{ matrix.os }}
          retention-days: 14
          path: |
            out/studio/**
          if-no-files-found: warn

      - name: Upload NSIS / electron-updater feed files
        if: startsWith(github.ref, 'refs/tags/studio-v')
        uses: actions/upload-artifact@v6
        with:
          name: studio-nsis-feed
          retention-days: 30
          path: |
            out/studio/make/**/*.exe
            out/studio/make/**/latest.yml
            out/studio/make/**/*.blockmap
          if-no-files-found: warn

      - name: GitHub draft Release (human download; feed 需另挂 HTTP 目录)
        if: startsWith(github.ref, 'refs/tags/studio-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            out/studio/make/**/*.exe
            out/studio/make/**/latest.yml
            out/studio/make/**/*.blockmap
          fail_on_unmatched_files: false
